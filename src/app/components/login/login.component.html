<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="login-form mx-auto">
                <h2 class="login-header">Đăng nhập</h2>
                <div class="form-group">
                    <label for="phoneNumber">Số Điện Thoại</label>
                    <input type="text" class="form-control" name="phone" id="phoneNumber" [(ngModel)]="phoneNumber"
                        name="phone" (focus)="loginForm.form.markAsTouched()"
                        placeholder="Nhập số điện thoại hoặc email" required>
                    <div class="divider-nospace"></div>
                </div>
                <div class="mt-5"></div>
                <div class="form-group password-field">
                    <label for="password">Mật khẩu</label>
                    <input name="password" placeholder="Ít nhất 8 ký tự" class="form-control" id="password"
                        type="{{showPassword ? 'text' : 'password'}}" [(ngModel)]="password">
                    <i class="password-toggle fas" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
                        (click)="togglePassword()"></i>
                    <div class="divider-nospace"></div>
                </div>
                <div class="form-group">
                    <div class="form-check checkbox-text">
                        <span style="display: flex;">
                            <input type="checkbox" class="form-check-input" [(ngModel)]="rememberMe" id="remember">
                            <label class="form-check-label text-start" for="remember">
                                Ghi nhớ đăng nhập</label>
                        </span>
                        <a href="#" class="register-link">Quên mật khẩu</a>
                    </div>
                </div>

                <button type="button" class="login-button" (click)="login()">Đăng nhập</button>
                <div class="divider"></div>
                <p class="text-center">Bạn chưa có tài khoản? <span>
                        <a class="register-link" (click)="registerAccount()">Tạo tài khoản</a>
                    </span></p>

            </div>
        </div>
